name: Deploy

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: AWS 자격 증명 설정 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 & Push
        run: |
          IMAGE=421085493505.dkr.ecr.ap-northeast-2.amazonaws.com/benly-backend:latest
          docker build --platform linux/amd64 -t $IMAGE .
          docker push $IMAGE

      - name: EC2에 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 421085493505.dkr.ecr.ap-northeast-2.amazonaws.com
            docker pull 421085493505.dkr.ecr.ap-northeast-2.amazonaws.com/benly-backend:latest
            docker stop benly || true
            docker rm benly || true
            docker run -d -p 8080:8080 --name benly 421085493505.dkr.ecr.ap-northeast-2.amazonaws.com/benly-backend:latest