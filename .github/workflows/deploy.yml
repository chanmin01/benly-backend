name: Deploy

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: AWS 자격 증명 설정 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 & Push
        run: |
          IMAGE=421085493505.dkr.ecr.ap-northeast-2.amazonaws.com/benly-backend:latest
          docker build --platform linux/amd64 -t $IMAGE .
          docker push $IMAGE

      - name: EC2에 배포 (SSM)
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy benly-backend" \
            --parameters '{"commands":[
              "aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 421085493505.dkr.ecr.ap-northeast-2.amazonaws.com",
              "docker pull 421085493505.dkr.ecr.ap-northeast-2.amazonaws.com/benly-backend:latest",
              "docker stop benly || true",
              "docker rm benly || true",
              "JWT_SECRET=$(aws ssm get-parameter --name /benly/prod/jwt-secret --with-decryption --query Parameter.Value --output text --region ap-northeast-2)",
              "docker run -d -p 8080:8080 --name benly -e JWT_SECRET=\"$JWT_SECRET\" 421085493505.dkr.ecr.ap-northeast-2.amazonaws.com/benly-backend:latest",
              "sleep 3",
              "echo \"JWT_SECRET length in container: $(docker exec benly printenv JWT_SECRET | wc -c)\""
            ]}' \
            --region ap-northeast-2 \
            --query "Command.CommandId" --output text)

          echo "Command sent: $COMMAND_ID. Waiting for completion..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --region ap-northeast-2 || true

          echo "===== Execution Result ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --region ap-northeast-2 \
            --query "{Status:Status, Output:StandardOutputContent, Error:StandardErrorContent}" \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --region ap-northeast-2 \
            --query "Status" --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi
          echo "Deploy succeeded"