spring.application.name=benly

# DataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-validity=3600000
jwt.refresh-token-validity=1209600000

# Server
server.port=8080

# OAuth
kakao.client-id=${KAKAO_CLIENT_ID}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.token-uri=https://kauth.kakao.com/oauth/token
kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

# Claude
claude.api-key=${CLAUDE_API_KEY}
claude.api-url=https://api.anthropic.com/v1/messages
claude.model=claude-sonnet-4-5

# OpenAI Whisper
openai.api-key=${OPENAI_API_KEY}
openai.whisper.api-url=https://api.openai.com/v1/audio/transcriptions
openai.whisper.model=whisper-1

# AWS S3
spring.cloud.aws.region.static=ap-northeast-2
benly.s3.bucket=${S3_BUCKET}
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB