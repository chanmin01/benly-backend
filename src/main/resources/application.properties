spring.application.name=benly

# DataSource
spring.datasource.url=jdbc:mysql://${DB_URL}:3306/benly?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=admin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-validity=3600000
jwt.refresh-token-validity=1209600000

# Server
server.port=8080

# OAuth
kakao.token-uri=https://kauth.kakao.com/oauth/token
kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
kakao.redirect-uri=http://localhost:3000/auth/kakao/callback