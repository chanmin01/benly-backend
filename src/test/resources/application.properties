spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

kakao.client-id=test-client-id
kakao.redirect-uri=http://localhost:3000/auth/kakao/callback
kakao.token-uri=https://kauth.kakao.com/oauth/token
kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

jwt.secret=test-secret-key-for-jwt-must-be-at-least-32-bytes-long
jwt.access-token-validity=3600000
jwt.refresh-token-validity=1209600000

claude.api-key=test-claude-key
claude.api-url=https://api.anthropic.com/v1/messages
claude.model=claude-sonnet-4-5

# AWS S3
spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
benly.s3.bucket=test-bucket

openai.api-key=test-api-key
openai.whisper.api-url=https://api.openai.com/v1/audio/transcriptions
openai.whisper.model=whisper-1